<style>
/* Rayada — nutrición & running. Estilos mobile-first, tema oscuro tipo app nativa. */
:root {
  --bg: #0a0e0c;
  --bg-2: #101613;
  --card: #141c18;
  --card-2: #1b2620;
  --border: #26332c;
  --text: #eaf5ee;
  --muted: #86988e;
  --accent: #37e0a0;      /* verde lima energético */
  --accent-2: #22b483;
  --accent-ink: #04160e;
  --lime: #b6f24a;
  --orange: #ff9a3c;
  --pink: #ff5c8a;
  --blue: #4aa8ff;
  --purple: #a98bff;
  --danger: #ff5c6c;
  --warn: #ffb020;
  --good: #37e0a0;
  --info: #4aa8ff;
  /* macros */
  --prot: #ff6b8b;
  --carbs: #f7b731;
  --grasa: #4aa8ff;
  --kcal: #37e0a0;
  --radius: 18px;
  --radius-sm: 12px;
  --shadow: 0 8px 30px rgba(0, 0, 0, 0.4);
  --safe-bottom: env(safe-area-inset-bottom, 0px);
  --safe-top: env(safe-area-inset-top, 0px);
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

html, body {
  margin: 0; padding: 0;
  background: var(--bg);
  color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  font-size: 16px;
  line-height: 1.4;
  -webkit-font-smoothing: antialiased;
  overscroll-behavior-y: none;
}

#app {
  max-width: 480px;
  margin: 0 auto;
  min-height: 100vh;
  min-height: 100dvh;
  background: var(--bg);
  position: relative;
  padding-bottom: calc(84px + var(--safe-bottom));
}

/* ---------- Header ---------- */
.header {
  position: sticky; top: 0; z-index: 20;
  padding: calc(16px + var(--safe-top)) 18px 14px;
  background: linear-gradient(180deg, var(--bg-2), rgba(10,14,12,0.85));
  backdrop-filter: blur(12px);
  border-bottom: 1px solid var(--border);
  display: flex; align-items: center; justify-content: space-between; gap: 10px;
}
.header h1 { margin: 0; font-size: 20px; font-weight: 800; letter-spacing: -0.3px; }
.header .sub { color: var(--muted); font-size: 13px; margin-top: 2px; }
.header .logo-dot { color: var(--accent); }

/* ---------- Layout ---------- */
.screen { padding: 16px 16px 24px; display: none; animation: fade .25s ease; }
.screen.active { display: block; }
@keyframes fade { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

.section-title {
  font-size: 13px; text-transform: uppercase; letter-spacing: 0.6px;
  color: var(--muted); margin: 22px 4px 10px; font-weight: 700;
}
.section-title:first-child { margin-top: 4px; }
.section-title .r { float: right; text-transform: none; letter-spacing: 0; color: var(--accent); font-weight: 600; }

/* ---------- Cards ---------- */
.card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 16px;
  margin-bottom: 12px;
}
.card.tight { padding: 14px; }
.card-title { font-weight: 700; font-size: 15px; margin: 0 0 4px; }
.card-title .ico { margin-right: 6px; }
.card-sub { color: var(--muted); font-size: 13px; }

/* Hero foco del día */
.hero {
  background: linear-gradient(135deg, #103528 0%, #0d2a22 55%, #12303a 100%);
  border: 1px solid #1e4636;
  border-radius: var(--radius);
  padding: 18px;
  margin-bottom: 14px;
}
.hero .label { color: #9fe9c8; font-size: 12px; text-transform: uppercase; letter-spacing: .5px; font-weight: 700; }
.hero .foco { font-size: 17px; font-weight: 700; margin: 8px 0 2px; line-height: 1.35; }

/* Entreno de hoy card */
.workout-hero { display: flex; gap: 14px; align-items: center; }
.workout-hero .wi {
  width: 56px; height: 56px; border-radius: 16px; flex-shrink: 0;
  display: grid; place-items: center; font-size: 28px;
  background: var(--card-2); border: 1px solid var(--border);
}
.workout-hero .wt { font-size: 17px; font-weight: 800; }
.workout-hero .ws { color: var(--muted); font-size: 13px; margin-top: 2px; }

/* ---------- Macro rings ---------- */
.macro-ring-row { display: flex; align-items: center; gap: 16px; }
.big-ring {
  --p: 0; --ring-color: var(--kcal);
  width: 108px; height: 108px; border-radius: 50%; flex-shrink: 0;
  background: conic-gradient(var(--ring-color) calc(var(--p) * 3.6deg), #22302a 0);
  display: grid; place-items: center; position: relative;
}
.big-ring::before { content: ""; position: absolute; inset: 9px; border-radius: 50%; background: var(--card); }
.big-ring .rv { position: relative; text-align: center; }
.big-ring .rv .n { font-size: 24px; font-weight: 800; line-height: 1; }
.big-ring .rv .l { font-size: 11px; color: var(--muted); margin-top: 3px; }

.macro-bars { flex: 1; min-width: 0; }
.mbar { margin-bottom: 10px; }
.mbar:last-child { margin-bottom: 0; }
.mbar .mt { display: flex; justify-content: space-between; font-size: 12.5px; margin-bottom: 4px; }
.mbar .mt .nm { font-weight: 700; }
.mbar .mt .vl { color: var(--muted); }
.mbar .track { height: 8px; background: var(--card-2); border-radius: 999px; overflow: hidden; }
.mbar .fill { height: 100%; border-radius: 999px; transition: width .3s ease; }
.fill.prot { background: var(--prot); } .nm.prot { color: var(--prot); }
.fill.carbs { background: var(--carbs); } .nm.carbs { color: var(--carbs); }
.fill.grasa { background: var(--grasa); } .nm.grasa { color: var(--grasa); }
.fill.kcal { background: var(--kcal); }

/* KPI grid */
.kpi-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.kpi-grid.three { grid-template-columns: 1fr 1fr 1fr; }
.kpi { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 14px; }
.kpi .k { font-size: 12px; color: var(--muted); }
.kpi .v { font-size: 19px; font-weight: 800; margin-top: 4px; }
.kpi .v.good { color: var(--good); } .kpi .v.bad { color: var(--danger); } .kpi .v.accent { color: var(--accent); }
.kpi .vs { font-size: 12px; color: var(--muted); margin-top: 2px; }

/* ---------- Alerts ---------- */
.alert {
  display: flex; gap: 12px; padding: 14px; border-radius: var(--radius-sm);
  margin-bottom: 10px; border: 1px solid var(--border); background: var(--card);
}
.alert .ico { font-size: 22px; line-height: 1; }
.alert .a-title { font-weight: 700; font-size: 15px; }
.alert .a-text { color: var(--muted); font-size: 13px; margin-top: 3px; }
.alert.danger { border-color: #5a2a30; background: #24151a; }
.alert.warn { border-color: #5a4a20; background: #241f13; }
.alert.good { border-color: #1f5540; background: #14241d; }
.alert.info { border-color: #234a6a; background: #13202b; }

/* ---------- Consejos (tips del experto) ---------- */
.tip {
  display: flex; gap: 13px; padding: 14px; border-radius: var(--radius-sm);
  background: var(--card); border: 1px solid var(--border); margin-bottom: 10px;
}
.tip .ico { font-size: 22px; line-height: 1.1; }
.tip .t-title { font-weight: 700; font-size: 14.5px; }
.tip .t-text { color: var(--muted); font-size: 13px; margin-top: 3px; }

/* ---------- Weekly plan (calendario) ---------- */
.week { display: flex; flex-direction: column; gap: 8px; }
.day-row {
  display: flex; align-items: center; gap: 12px; padding: 12px 14px;
  border-radius: var(--radius-sm); background: var(--card); border: 1px solid var(--border);
}
.day-row.today { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent) inset; }
.day-row .dd { width: 42px; flex-shrink: 0; text-align: center; }
.day-row .dd .dn { font-size: 11px; color: var(--muted); text-transform: uppercase; }
.day-row .dd .di { font-size: 22px; margin-top: 2px; }
.day-row .dmain { flex: 1; min-width: 0; }
.day-row .dtitle { font-weight: 700; font-size: 15px; }
.day-row .dtext { color: var(--muted); font-size: 12.5px; margin-top: 2px; }
.day-row .badge {
  font-size: 10.5px; padding: 3px 8px; border-radius: 999px; font-weight: 700;
  background: var(--card-2); border: 1px solid var(--border); color: var(--muted);
  white-space: nowrap;
}
.badge.hard { color: var(--pink); border-color: #5a2a3a; }
.badge.tempo { color: var(--orange); border-color: #5a4020; }
.badge.long { color: var(--purple); border-color: #3f3a5a; }
.badge.easy { color: var(--accent); border-color: #1f5540; }
.badge.gym { color: var(--lime); border-color: #45521f; }
.badge.futbol { color: var(--blue); border-color: #234a6a; }
.badge.rest { color: var(--muted); }

/* Session detail box */
.sess { background: var(--card-2); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 14px; margin-top: 4px; }
.sess .srow { display: flex; gap: 8px; font-size: 13.5px; padding: 4px 0; }
.sess .srow .sk { color: var(--muted); width: 92px; flex-shrink: 0; }
.sess .srow .sv { font-weight: 600; }
.sess .stip { font-size: 12.5px; color: var(--muted); margin-top: 8px; padding-top: 8px; border-top: 1px solid var(--border); }
.sess .main-detail { font-weight: 700; font-size: 15px; margin-bottom: 6px; }

/* pace zones */
.zone { display: flex; justify-content: space-between; align-items: center; padding: 11px 0; border-bottom: 1px solid var(--border); }
.zone:last-child { border-bottom: none; }
.zone .zn { font-weight: 700; font-size: 14px; }
.zone .zd { color: var(--muted); font-size: 12px; margin-top: 1px; }
.zone .zv { font-weight: 800; font-size: 16px; }
.zone.goal .zv { color: var(--accent); }

/* ---------- Lists ---------- */
.list-item {
  display: flex; align-items: center; gap: 12px; padding: 13px 4px;
  border-bottom: 1px solid var(--border);
}
.list-item:last-child { border-bottom: none; }
.list-item .avatar {
  width: 40px; height: 40px; border-radius: 12px; flex-shrink: 0;
  display: grid; place-items: center; font-size: 18px;
  background: var(--card-2); border: 1px solid var(--border);
}
.list-item .li-main { flex: 1; min-width: 0; }
.list-item .li-title { font-weight: 600; font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.list-item .li-sub { color: var(--muted); font-size: 12.5px; margin-top: 2px; }
.list-item .li-right { text-align: right; white-space: nowrap; }
.list-item .li-amount { font-weight: 700; font-size: 15px; }
.list-item .li-del { color: var(--muted); font-size: 20px; padding: 4px 6px; cursor: pointer; }

.empty { text-align: center; color: var(--muted); padding: 34px 20px; }
.empty .big-emoji { font-size: 44px; margin-bottom: 10px; }

/* ---------- Meal groups ---------- */
.meal-group { margin-bottom: 14px; }
.meal-head { display: flex; justify-content: space-between; align-items: baseline; margin: 0 4px 6px; }
.meal-head .mh-name { font-weight: 700; font-size: 15px; }
.meal-head .mh-kcal { color: var(--muted); font-size: 13px; }

/* plan comida ejemplo */
.plan-meal { border-left: 3px solid var(--accent); padding: 4px 0 4px 12px; margin-bottom: 12px; }
.plan-meal .pm-top { display: flex; justify-content: space-between; }
.plan-meal .pm-title { font-weight: 700; font-size: 14.5px; }
.plan-meal .pm-kcal { color: var(--muted); font-size: 12.5px; }
.plan-meal ul { margin: 6px 0 0; padding-left: 18px; }
.plan-meal li { font-size: 13.5px; color: var(--text); margin-bottom: 3px; }

/* ---------- Water tracker ---------- */
.water-row { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 10px; }
.cup {
  width: 34px; height: 42px; border-radius: 6px 6px 10px 10px; cursor: pointer;
  border: 2px solid var(--blue); background: transparent; position: relative;
  display: grid; place-items: end center; overflow: hidden;
}
.cup.full { background: linear-gradient(180deg, #2a6ea8, var(--blue)); }
.cup span { font-size: 14px; padding-bottom: 3px; }

/* ---------- Progress chart (SVG) ---------- */
.chart { width: 100%; height: 160px; }
.chart-wrap { overflow-x: auto; }
.chart .grid-line { stroke: var(--border); stroke-width: 1; }
.chart .line { fill: none; stroke: var(--accent); stroke-width: 2.5; }
.chart .area { fill: url(#grad); opacity: 0.25; }
.chart .dot { fill: var(--accent); }
.chart .lbl { fill: var(--muted); font-size: 10px; }
.chart .goal-line { stroke: var(--orange); stroke-width: 1.5; stroke-dasharray: 4 4; }

.progress-hero {
  background: linear-gradient(135deg, #2a1e0d, #1a1508);
  border: 1px solid #4a3a1a; border-radius: var(--radius); padding: 18px; margin-bottom: 14px;
}
.progress-hero .ph-label { color: var(--warn); font-size: 12px; text-transform: uppercase; letter-spacing: .5px; font-weight: 700; }
.progress-hero .ph-big { font-size: 30px; font-weight: 800; margin: 6px 0 2px; }
.progress-hero .ph-sub { color: var(--muted); font-size: 13px; }
.progress-track { height: 10px; background: rgba(255,255,255,0.08); border-radius: 999px; overflow: hidden; margin-top: 12px; }
.progress-track > span { display: block; height: 100%; background: linear-gradient(90deg, var(--orange), var(--accent)); }

/* ---------- Buttons ---------- */
.btn {
  border: none; border-radius: 12px; padding: 13px 16px; font-size: 15px; font-weight: 700;
  cursor: pointer; font-family: inherit; transition: transform .05s ease, opacity .15s;
}
.btn:active { transform: scale(0.97); }
.btn.primary { background: var(--accent); color: var(--accent-ink); width: 100%; }
.btn.secondary { background: var(--card-2); color: var(--text); border: 1px solid var(--border); }
.btn.ghost { background: transparent; color: var(--muted); border: 1px solid var(--border); }
.btn.danger { background: transparent; color: var(--danger); border: 1px solid #5a2a30; }
.btn.sm { padding: 9px 12px; font-size: 13px; flex: 1; }
.btn.block { width: 100%; }
.btn-row { display: flex; gap: 10px; margin-top: 8px; }

/* Segmented control */
.segmented { display: flex; background: var(--card-2); border-radius: 12px; padding: 4px; gap: 4px; margin-bottom: 16px; overflow-x: auto; }
.segmented button {
  flex: 1; border: none; background: transparent; color: var(--muted); white-space: nowrap;
  padding: 10px; border-radius: 9px; font-weight: 700; font-size: 13.5px; cursor: pointer; font-family: inherit;
}
.segmented button.active { background: var(--accent); color: var(--accent-ink); }

/* ---------- Forms ---------- */
.field { margin-bottom: 14px; }
.field label { display: block; font-size: 13px; color: var(--muted); margin-bottom: 6px; font-weight: 600; }
.field input, .field select, .field textarea {
  width: 100%; background: var(--bg-2); border: 1px solid var(--border); color: var(--text);
  border-radius: 12px; padding: 13px 14px; font-size: 16px; font-family: inherit; outline: none;
}
.field input:focus, .field select:focus, .field textarea:focus { border-color: var(--accent); }
.field.amount input { font-size: 26px; font-weight: 800; text-align: center; }
.field-row { display: flex; gap: 10px; }
.field-row .field { flex: 1; }
.hint { font-size: 12px; color: var(--muted); margin-top: 6px; }
.chips { display: flex; gap: 8px; flex-wrap: wrap; }
.chip {
  padding: 9px 13px; border-radius: 999px; background: var(--card-2); border: 1px solid var(--border);
  color: var(--text); font-size: 13px; cursor: pointer; font-family: inherit; font-weight: 600;
}
.chip.active { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.day-toggles { display: flex; gap: 6px; }
.day-toggles .dt {
  flex: 1; text-align: center; padding: 10px 0; border-radius: 10px; cursor: pointer;
  background: var(--card-2); border: 1px solid var(--border); color: var(--muted); font-weight: 700; font-size: 13px;
}
.day-toggles .dt.active { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }

/* Editor de semana (Ajustes) */
.day-edit { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 12px; margin-bottom: 8px; }
.day-edit .de-top { display: flex; align-items: center; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
.day-edit .de-day { font-weight: 700; font-size: 14px; min-width: 74px; }
.day-edit .de-types { display: flex; gap: 4px; flex-wrap: wrap; }
.day-edit .de-t {
  border: 1px solid var(--border); background: var(--card-2); color: var(--muted);
  border-radius: 999px; padding: 6px 9px; font-size: 11.5px; font-weight: 700; cursor: pointer; font-family: inherit;
}
.day-edit .de-t.active { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.day-edit .de-grupos { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--border); }
.chip2 {
  padding: 7px 11px; border-radius: 999px; background: var(--card-2); border: 1px solid var(--border);
  color: var(--text); font-size: 12.5px; cursor: pointer; font-weight: 600;
}
.chip2.active { background: var(--lime); color: #1a2408; border-color: var(--lime); }

/* Fotos de progreso */
.photo-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; }
.photo-cell {
  position: relative; aspect-ratio: 3/4; border-radius: var(--radius-sm); overflow: hidden;
  background: var(--card-2); border: 1px solid var(--border); cursor: pointer;
}
.photo-cell img { width: 100%; height: 100%; object-fit: cover; display: block; }
.photo-cell .pc-date { position: absolute; left: 0; right: 0; bottom: 0; font-size: 10px; padding: 3px 5px;
  background: linear-gradient(180deg, transparent, rgba(0,0,0,0.75)); color: #fff; text-align: center; }
.photo-viewer { position: fixed; inset: 0; z-index: 60; background: rgba(0,0,0,0.92);
  display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 20px; }
.photo-viewer img { max-width: 100%; max-height: 78vh; border-radius: 12px; }
.photo-viewer .pv-meta { color: #eaf5ee; margin-top: 14px; text-align: center; }
.photo-viewer .pv-actions { display: flex; gap: 10px; margin-top: 16px; }

/* ---------- Bottom nav ---------- */
.nav {
  position: fixed; bottom: 0; left: 50%; transform: translateX(-50%);
  width: 100%; max-width: 480px; z-index: 30;
  display: flex; background: rgba(16,22,19,0.93); backdrop-filter: blur(16px);
  border-top: 1px solid var(--border);
  padding: 8px 6px calc(8px + var(--safe-bottom));
}
.nav button {
  flex: 1; background: none; border: none; color: var(--muted); font-family: inherit;
  display: flex; flex-direction: column; align-items: center; gap: 3px; cursor: pointer;
  padding: 6px 2px; font-size: 11px; font-weight: 600; border-radius: 10px;
}
.nav button .ni { font-size: 21px; }
.nav button.active { color: var(--accent); }

/* FAB */
.fab {
  position: fixed; bottom: calc(78px + var(--safe-bottom)); left: 50%;
  transform: translateX(calc(-50% + 176px));
  width: 56px; height: 56px; border-radius: 50%; z-index: 25;
  background: var(--accent); color: var(--accent-ink); border: none; font-size: 28px; font-weight: 300;
  box-shadow: var(--shadow); cursor: pointer; display: grid; place-items: center;
}
.fab:active { transform: translateX(calc(-50% + 176px)) scale(0.94); }
@media (max-width: 480px) { .fab { transform: translateX(calc(-50% + 36vw)); } .fab:active { transform: translateX(calc(-50% + 36vw)) scale(0.94); } }

/* ---------- Modal / sheet ---------- */
.sheet-overlay {
  position: fixed; inset: 0; z-index: 40; background: rgba(0,0,0,0.6);
  display: none; align-items: flex-end; justify-content: center;
}
.sheet-overlay.open { display: flex; animation: fade .2s ease; }
.sheet {
  width: 100%; max-width: 480px; background: var(--bg-2);
  border-radius: 22px 22px 0 0; border: 1px solid var(--border); border-bottom: none;
  padding: 8px 18px calc(24px + var(--safe-bottom));
  max-height: 92dvh; overflow-y: auto; animation: slideup .28s cubic-bezier(.2,.9,.3,1);
}
@keyframes slideup { from { transform: translateY(100%); } to { transform: none; } }
.sheet .grab { width: 40px; height: 5px; border-radius: 3px; background: var(--border); margin: 8px auto 14px; }
.sheet h2 { margin: 0 0 16px; font-size: 20px; }

/* food search results */
.food-results { max-height: 320px; overflow-y: auto; margin: 4px -4px 0; }
.food-item { display: flex; justify-content: space-between; align-items: center; gap: 10px;
  padding: 12px 8px; border-bottom: 1px solid var(--border); cursor: pointer; border-radius: 8px; }
.food-item:active { background: var(--card); }
.food-item .fname { font-weight: 600; font-size: 14.5px; }
.food-item .fmacro { color: var(--muted); font-size: 12px; margin-top: 2px; }
.food-item .fkcal { font-weight: 700; font-size: 14px; white-space: nowrap; }

/* ---------- Onboarding ---------- */
#onb-root {
  position: fixed; inset: 0; z-index: 200; overflow-y: auto;
  background: radial-gradient(120% 80% at 50% 0%, #123528 0%, var(--bg) 55%);
}
.onb-wrap { max-width: 480px; margin: 0 auto; min-height: 100dvh;
  padding: calc(30px + var(--safe-top)) 22px calc(30px + var(--safe-bottom)); display: flex; flex-direction: column; }
.onb-logo { text-align: center; margin-bottom: 8px; }
.onb-logo .em { font-size: 46px; }
.onb-title { font-size: 26px; font-weight: 800; text-align: center; margin: 6px 0 4px; letter-spacing: -0.5px; }
.onb-sub { color: var(--muted); text-align: center; font-size: 14px; margin-bottom: 22px; }
.onb-step-label { color: var(--accent); font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: .5px; margin-bottom: 6px; }

<script>
/* format.js — utilidades de formato (fechas, números, tiempo y ritmo de running) */
(function () {
  "use strict";

  const NUM = new Intl.NumberFormat("es-CO", { maximumFractionDigits: 0 });
  const NUM1 = new Intl.NumberFormat("es-CO", { maximumFractionDigits: 1 });

  function num(n, d) {
    if (n == null || isNaN(n)) return "0";
    return (d === 1 ? NUM1 : NUM).format(n);
  }

  function pct(n, digits) {
    if (n == null || isNaN(n)) return "0%";
    return (
      new Intl.NumberFormat("es-CO", {
        maximumFractionDigits: digits == null ? 0 : digits,
      }).format(n * 100) + "%"
    );
  }

  // ---------- Tiempo (running) ----------
  // Segundos -> "mm:ss" o "h:mm:ss"
  function tiempo(seg) {
    seg = Math.max(0, Math.round(+seg || 0));
    const h = Math.floor(seg / 3600);
    const m = Math.floor((seg % 3600) / 60);
    const s = seg % 60;
    const mm = String(m).padStart(2, "0");
    const ss = String(s).padStart(2, "0");
    if (h > 0) return `${h}:${mm}:${ss}`;
    return `${m}:${ss}`;
  }

  // Ritmo: segundos por km -> "m:ss /km"
  function ritmo(segPorKm) {
    if (!segPorKm || isNaN(segPorKm) || !isFinite(segPorKm)) return "—";
    const s = Math.round(segPorKm);
    const m = Math.floor(s / 60);
    const ss = String(s % 60).padStart(2, "0");
    return `${m}:${ss}/km`;
  }

  // Parsea "20:00", "4:00", "1:05:30", "90" (seg) -> segundos
  function parseTiempo(str) {
    if (typeof str === "number") return str;
    if (!str) return 0;
    const parts = String(str).trim().split(":").map((x) => parseInt(x, 10) || 0);
    if (parts.length === 3) return parts[0] * 3600 + parts[1] * 60 + parts[2];
    if (parts.length === 2) return parts[0] * 60 + parts[1];
    return parts[0] || 0;
  }

  // km/h a partir de segundos por km
  function velocidad(segPorKm) {
    if (!segPorKm) return 0;
    return 3600 / segPorKm;
  }

  const DIAS = ["dom", "lun", "mar", "mié", "jue", "vie", "sáb"];
  const DIAS_LARGO = ["Domingo", "Lunes", "Martes", "Miércoles", "Jueves", "Viernes", "Sábado"];
  const MESES = [
    "enero", "febrero", "marzo", "abril", "mayo", "junio",
    "julio", "agosto", "septiembre", "octubre", "noviembre", "diciembre",
  ];

  function toDate(d) {
    if (d instanceof Date) return d;
    const parts = String(d).split("-");
    if (parts.length === 3) {
      return new Date(+parts[0], +parts[1] - 1, +parts[2]);
    }
    return new Date(d);
  }

  function ymd(d) {
    const dt = toDate(d);
    const m = String(dt.getMonth() + 1).padStart(2, "0");
    const day = String(dt.getDate()).padStart(2, "0");
    return `${dt.getFullYear()}-${m}-${day}`;
  }

  function fecha(d) {
    const dt = toDate(d);
    return `${dt.getDate()} ${MESES[dt.getMonth()].slice(0, 3)} ${dt.getFullYear()}`;
  }

  function fechaLarga(d) {
    const dt = toDate(d);
    return `${DIAS[dt.getDay()]} ${dt.getDate()} de ${MESES[dt.getMonth()]}`;
  }

  function hoy() {
    const d = new Date();
    return new Date(d.getFullYear(), d.getMonth(), d.getDate());
  }

  function diasEntre(a, b) {
    const ms = toDate(b).getTime() - toDate(a).getTime();
    return Math.round(ms / 86400000);
  }

  function relativo(dias) {
    if (dias === 0) return "hoy";
    if (dias === 1) return "mañana";
    if (dias === -1) return "ayer";
    if (dias > 1) return `en ${dias} días`;
    return `hace ${Math.abs(dias)} días`;
  }

  // Índice de día de semana empezando en lunes (0 = lunes ... 6 = domingo)
  function diaSemanaLun(d) {
    const g = toDate(d).getDay(); // 0=dom
    return (g + 6) % 7;
  }

  window.Fmt = {
    num, pct,
    tiempo, ritmo, parseTiempo, velocidad,
    toDate, ymd, fecha, fechaLarga, hoy, diasEntre, relativo, diaSemanaLun,
    MESES, DIAS, DIAS_LARGO,
  };
})();

/* store.js — capa de datos local (localStorage). Todo vive en el teléfono. */
(function () {
  "use strict";

  const KEY = "rayada.v1";

  const DEFAULT = {
    version: 1,
    profile: {
      nombre: "",
      sexo: "F",            // F | M
      edad: 28,
      alturaCm: 165,
      pesoKg: 62,           // peso actual (se sincroniza con última medición)
      objetivo: "definicion", // definicion | perder | mantener
      nivelActividad: "alto", // sedentario | ligero | moderado | alto | atleta
      // Compromisos fijos de la semana (0=lun ... 6=dom)
      diasGym: [0, 1, 2, 3, 4], // lun a vie
      diasFutbol: [],        // sin fútbol por defecto (configúralo en Ajustes)
      diasDescanso: [6],     // dom
      // Split de gym: grupos musculares por día (0=lun ... 6=dom)
      gymGrupos: {
        0: ["pierna"],
        1: ["espalda", "hombro", "biceps"],
        2: ["pecho", "triceps"],
        3: ["pierna"],
        4: ["tren superior"],
      },
      // Reto de running
      objetivoTiempoSeg: 1200, // 20:00 en 5k
      objetivoDistanciaKm: 5,
      mejor5kSeg: 0,          // se calcula del último test; 0 = sin dato
      fechaReto: "",          // opcional
      aguaMetaVasos: 8,
      onboarded: false,
    },
    // Registro de comidas: {id, date, comida, label, kcal, prot, carbs, grasa}
    comidas: [],
    // Entrenamientos hechos: {id, date, tipo, titulo, minutos, km, timeSeg, rpe, nota}
    entrenos: [],
    // Mediciones: {id, date, pesoKg, cintura, cadera, grasaPct, nota}
    mediciones: [],
    // Alimentos personalizados: {id, nombre, unidad, kcal, prot, carbs, grasa}
    alimentos: [],
    // Agua por día: { 'YYYY-MM-DD': vasos }
    agua: {},
  };

  let state = null;

  function load() {
    try {
      const raw = localStorage.getItem(KEY);
      if (raw) {
        const parsed = JSON.parse(raw);
        state = Object.assign({}, DEFAULT, parsed);
        state.profile = Object.assign({}, DEFAULT.profile, parsed.profile);
      } else {
        state = JSON.parse(JSON.stringify(DEFAULT));
      }
    } catch (e) {
      console.error("Error cargando datos, reiniciando:", e);
      state = JSON.parse(JSON.stringify(DEFAULT));
    }
    return state;
  }

  function save() {
    try {
      localStorage.setItem(KEY, JSON.stringify(state));
    } catch (e) {
      console.error("Error guardando:", e);
    }
    window.dispatchEvent(new CustomEvent("store:changed"));
  }

  function get() {
    if (!state) load();
    return state;
  }

  function uid() {
    return Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
  }

  // ---------- Perfil ----------
  function updateProfile(patch) {
    Object.assign(get().profile, patch);
    save();
  }
  function setOnboarded(v) {
    get().profile.onboarded = !!v;
    save();
  }

  // ---------- Comidas ----------
  function addComida(c) {
    const item = {
      id: uid(),
      date: c.date || window.Fmt.ymd(window.Fmt.hoy()),
      comida: c.comida || "snack", // desayuno | almuerzo | cena | snack
      label: c.label || "Comida",
      kcal: Math.max(0, Math.round(+c.kcal || 0)),
      prot: Math.max(0, +c.prot || 0),
      carbs: Math.max(0, +c.carbs || 0),
      grasa: Math.max(0, +c.grasa || 0),
    };
    get().comidas.push(item);
    save();
    return item;
  }
  function deleteComida(id) {
    state.comidas = get().comidas.filter((x) => x.id !== id);
    save();
  }
  function comidasDe(dateStr) {
    return get().comidas.filter((c) => c.date === dateStr);
  }

  // ---------- Entrenamientos ----------
  function addEntreno(e) {
    const item = {
      id: uid(),
      date: e.date || window.Fmt.ymd(window.Fmt.hoy()),
      tipo: e.tipo || "easy", // easy|intervals|tempo|long|gym|futbol|test5k|carrera|movilidad
      titulo: e.titulo || "",
      minutos: Math.max(0, Math.round(+e.minutos || 0)),
      km: Math.max(0, +e.km || 0),
      timeSeg: Math.max(0, Math.round(+e.timeSeg || 0)),
      rpe: Math.min(10, Math.max(0, +e.rpe || 0)),
      nota: e.nota || "",
    };
    get().entrenos.push(item);
    // Si es un test de 5k, actualiza el mejor tiempo del perfil
    if (item.tipo === "test5k" && item.timeSeg > 0) {
      const p = get().profile;
      if (!p.mejor5kSeg || item.timeSeg < p.mejor5kSeg) p.mejor5kSeg = item.timeSeg;
    }
    save();
    return item;
  }
  function deleteEntreno(id) {
    state.entrenos = get().entrenos.filter((x) => x.id !== id);
    // Recalcula mejor 5k
    recomputeMejor5k();
    save();
  }
  function entrenosDe(dateStr) {
    return get().entrenos.filter((e) => e.date === dateStr);
  }
  function recomputeMejor5k() {
    const tests = get().entrenos.filter((e) => e.tipo === "test5k" && e.timeSeg > 0);
    get().profile.mejor5kSeg = tests.length ? Math.min.apply(null, tests.map((t) => t.timeSeg)) : 0;
  }
  function tests5k() {
    return get().entrenos
      .filter((e) => e.tipo === "test5k" && e.timeSeg > 0)
      .sort((a, b) => a.date.localeCompare(b.date));
  }

  // ---------- Mediciones ----------
  function addMedicion(m) {
    const item = {
      id: uid(),
      date: m.date || window.Fmt.ymd(window.Fmt.hoy()),
      pesoKg: +m.pesoKg || 0,
      cintura: +m.cintura || 0,
      cadera: +m.cadera || 0,
      grasaPct: +m.grasaPct || 0,
      nota: m.nota || "",
    };
    get().mediciones.push(item);
    // sincroniza peso actual con la medición más reciente
    if (item.pesoKg > 0) {
      const recientes = get().mediciones.filter((x) => x.pesoKg > 0)
        .sort((a, b) => b.date.localeCompare(a.date));
      if (recientes.length && recientes[0].id === item.id) {
        get().profile.pesoKg = item.pesoKg;
      } else if (recientes.length) {
        get().profile.pesoKg = recientes[0].pesoKg;
      }
    }
    save();
    return item;
  }
  function deleteMedicion(id) {
    state.mediciones = get().mediciones.filter((x) => x.id !== id);
    const recientes = get().mediciones.filter((x) => x.pesoKg > 0)
      .sort((a, b) => b.date.localeCompare(a.date));
    if (recientes.length) get().profile.pesoKg = recientes[0].pesoKg;
    save();
  }
  function medicionesOrdenadas() {
    return get().mediciones.slice().sort((a, b) => a.date.localeCompare(b.date));
  }

  // ---------- Alimentos personalizados ----------
  function addAlimento(a) {
    const item = {
      id: uid(),
      nombre: a.nombre || "Alimento",
      unidad: a.unidad || "porción",
      kcal: Math.max(0, Math.round(+a.kcal || 0)),
      prot: Math.max(0, +a.prot || 0),
      carbs: Math.max(0, +a.carbs || 0),
      grasa: Math.max(0, +a.grasa || 0),
    };
    get().alimentos.push(item);
    save();
    return item;
  }
  function deleteAlimento(id) {
    state.alimentos = get().alimentos.filter((x) => x.id !== id);
    save();
  }

  // ---------- Agua ----------
  function setAgua(dateStr, vasos) {
    get().agua[dateStr] = Math.max(0, Math.round(vasos));
    save();
  }
  function getAgua(dateStr) {
    return get().agua[dateStr] || 0;
  }

  // ---------- Import / Export ----------
  function exportJSON() {
    return JSON.stringify(get(), null, 2);
  }
  function importJSON(json) {
    try {
      const data = typeof json === "string" ? JSON.parse(json) : json;
      state = Object.assign({}, DEFAULT, data);
      state.profile = Object.assign({}, DEFAULT.profile, data.profile || {});
      save();
      return true;
    } catch (e) {
      console.error("Import inválido:", e);
      return false;
    }
  }
  function reset() {
    state = JSON.parse(JSON.stringify(DEFAULT));
    save();
  }

  window.Store = {
    load, save, get, uid,
    updateProfile, setOnboarded,
    addComida, deleteComida, comidasDe,
    addEntreno, deleteEntreno, entrenosDe, tests5k,
    addMedicion, deleteMedicion, medicionesOrdenadas,
    addAlimento, deleteAlimento,
    setAgua, getAgua,
    exportJSON, importJSON, reset,
  };
})();

/* photos.js — Fotos de progreso guardadas en IndexedDB (no llenan el
   localStorage). Cada foto: {id, date, nota, blob}. Solo viven en el teléfono. */
(function () {
  "use strict";

  const DB = "rayada.fotos";
  const STORE = "fotos";
  let dbp = null;

  function open() {
    if (dbp) return dbp;
    dbp = new Promise((resolve, reject) => {
      if (!("indexedDB" in window)) { reject(new Error("Sin IndexedDB")); return; }
      const req = indexedDB.open(DB, 1);
      req.onupgradeneeded = () => {
        const db = req.result;
        if (!db.objectStoreNames.contains(STORE)) {
          const os = db.createObjectStore(STORE, { keyPath: "id" });
          os.createIndex("date", "date", { unique: false });
        }
      };
      req.onsuccess = () => resolve(req.result);
      req.onerror = () => reject(req.error);
    });
    return dbp;
  }

  function tx(mode) {
    return open().then((db) => db.transaction(STORE, mode).objectStore(STORE));
  }

  function uid() {
    return Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
  }

  // Redimensiona la imagen a máx ~1200px y comprime a JPEG para ahorrar espacio.
  function comprimir(file, maxLado, calidad) {
    return new Promise((resolve) => {
      const img = new Image();
      const url = URL.createObjectURL(file);
      img.onload = () => {
        let { width, height } = img;
        const max = maxLado || 1200;
        if (Math.max(width, height) > max) {
          const r = max / Math.max(width, height);
          width = Math.round(width * r); height = Math.round(height * r);
        }
        const canvas = document.createElement("canvas");
        canvas.width = width; canvas.height = height;
        canvas.getContext("2d").drawImage(img, 0, 0, width, height);
        canvas.toBlob((blob) => {
          URL.revokeObjectURL(url);
          resolve(blob || file);
        }, "image/jpeg", calidad || 0.82);
      };
      img.onerror = () => { URL.revokeObjectURL(url); resolve(file); };
      img.src = url;
    });
  }

  async function add(file, meta) {
    const blob = await comprimir(file, 1200, 0.82);
    const item = {
      id: uid(),
      date: (meta && meta.date) || window.Fmt.ymd(window.Fmt.hoy()),
      nota: (meta && meta.nota) || "",
      blob,
    };
    const store = await tx("readwrite");
    return new Promise((resolve, reject) => {
      const r = store.add(item);
      r.onsuccess = () => resolve(item);
      r.onerror = () => reject(r.error);
    });
  }

  // Devuelve metadatos (sin blob) ordenados por fecha ascendente.
  async function list() {
    const store = await tx("readonly");
    return new Promise((resolve, reject) => {
      const out = [];
      const req = store.openCursor();
      req.onsuccess = () => {
        const cur = req.result;
        if (cur) {
          const v = cur.value;
          out.push({ id: v.id, date: v.date, nota: v.nota });
          cur.continue();
        } else {
          out.sort((a, b) => a.date.localeCompare(b.date) || a.id.localeCompare(b.id));
          resolve(out);
        }
      };
      req.onerror = () => reject(req.error);
    });
  }

  async function getBlob(id) {
    const store = await tx("readonly");
    return new Promise((resolve, reject) => {
      const r = store.get(id);
      r.onsuccess = () => resolve(r.result ? r.result.blob : null);
      r.onerror = () => reject(r.error);
    });
  }

  async function url(id) {
    const blob = await getBlob(id);
    return blob ? URL.createObjectURL(blob) : null;
  }

  async function remove(id) {
    const store = await tx("readwrite");
    return new Promise((resolve, reject) => {
      const r = store.delete(id);
      r.onsuccess = () => resolve(true);
      r.onerror = () => reject(r.error);
    });
  }

  async function count() {
    try { return (await list()).length; } catch (e) { return 0; }
  }

  window.Fotos = { add, list, url, getBlob, remove, count };
})();

/* nutrition.js — Motor de nutrición ("el nutricionista").
   Calcula gasto energético, calorías y macros para DEFINICIÓN (bajar grasa
   manteniendo músculo), y arma planes de comida ajustados a tu entrenamiento.
   Todos los valores están calibrados para una atleta que corre + gym + fútbol. */
(function () {
  "use strict";

  // Multiplicadores de actividad (base, sin contar el entreno del día)
  const ACTIVIDAD = {
    sedentario: 1.2,
    ligero: 1.375,
    moderado: 1.55,
    alto: 1.725,
    atleta: 1.9,
  };

  // Gasto extra estimado por tipo de sesión (kcal aproximadas)
  const GASTO_SESION = {
    easy: 350, intervals: 500, tempo: 450, long: 650,
    gym: 300, futbol: 600, test5k: 400, carrera: 500, movilidad: 120,
  };

  // Mifflin-St Jeor (TMB / metabolismo basal)
  function tmb(p) {
    const base = 10 * p.pesoKg + 6.25 * p.alturaCm - 5 * p.edad;
    return Math.round(p.sexo === "M" ? base + 5 : base - 161);
  }

  // Gasto total diario (mantenimiento) según nivel de actividad
  function tdee(p) {
    const mult = ACTIVIDAD[p.nivelActividad] || 1.55;
    return Math.round(tmb(p) * mult);
  }

  // Objetivo calórico según la meta
  function objetivoCalorico(p) {
    const mant = tdee(p);
    let deficitPct = 0;
    if (p.objetivo === "definicion") deficitPct = 0.17; // déficit moderado: baja grasa sin perder rendimiento
    else if (p.objetivo === "perder") deficitPct = 0.22; // déficit algo mayor
    else deficitPct = 0; // mantener
    const objetivo = Math.round(mant * (1 - deficitPct));
    // Piso de seguridad: no bajar demasiado (rendimiento y salud hormonal)
    const piso = Math.round((p.sexo === "M" ? 1500 : 1300));
    return { mantenimiento: mant, objetivo: Math.max(objetivo, piso), deficitPct };
  }

  // Ritmo de peso objetivo por semana (kg) según la meta.
  function ritmoMetaSem(p) { return p.objetivo === "perder" ? -0.6 : p.objetivo === "definicion" ? -0.4 : 0; }

  // ---------- Aprendizaje: ajuste adaptativo de calorías ----------
  // La app "aprende" de tu respuesta real: si no bajas al ritmo que buscas,
  // ajusta las calorías. 1 kg de grasa ≈ 7700 kcal → ~1100 kcal/día por kg/sem.
  function aprendizaje(p) {
    const meds = (window.Store ? window.Store.medicionesOrdenadas() : [])
      .filter((m) => m.pesoKg > 0);
    if (meds.length < 2) {
      return { hayDato: false, ajuste: 0, texto: "Registra tu peso al menos 2 veces (con ~1–2 semanas entre medias) y ajustaré tus calorías según tu progreso real." };
    }
    // Usa el tramo de los últimos ~21 días (o los dos extremos disponibles)
    const ult = meds[meds.length - 1];
    let ref = meds[0];
    for (let i = meds.length - 1; i >= 0; i--) {
      if (window.Fmt.diasEntre(meds[i].date, ult.date) >= 10) { ref = meds[i]; break; }
    }
    const dias = Math.max(1, window.Fmt.diasEntre(ref.date, ult.date));
    if (dias < 7) {
      return { hayDato: false, ajuste: 0, texto: "Aún es pronto para ajustar: dame ~1 semana de datos de peso y aprendo tu ritmo." };
    }
    const ritmoReal = (ult.pesoKg - ref.pesoKg) / (dias / 7); // kg/semana
    const objetivo = ritmoMetaSem(p);
    if (p.objetivo === "mantener") {
      return { hayDato: true, ajuste: 0, ritmoReal, objetivo, texto: `Tu peso cambia ${window.Fmt.num(ritmoReal,1)} kg/sem. Objetivo: mantener.` };
    }
    let ajuste = Math.round((objetivo - ritmoReal) * 1100);
    ajuste = Math.max(-350, Math.min(350, ajuste)); // acota el ajuste
    // redondea a 25
    ajuste = Math.round(ajuste / 25) * 25;
    let texto;
    if (ritmoReal > 0.1) {
      texto = `Estás subiendo ${window.Fmt.num(ritmoReal,1)} kg/sem. Bajé tus calorías ${Math.abs(ajuste)} kcal para retomar la definición.`;
    } else if (ajuste <= -25) {
      texto = `Bajas ${window.Fmt.num(Math.abs(ritmoReal),1)} kg/sem, más lento que tu meta. Ajusté −${Math.abs(ajuste)} kcal para acelerar sin perder músculo.`;
    } else if (ajuste >= 25) {
      texto = `Bajas ${window.Fmt.num(Math.abs(ritmoReal),1)} kg/sem, más rápido de lo ideal. Subí +${ajuste} kcal para cuidar tu músculo y tu rendimiento.`;
    } else {
      texto = `Vas a ${window.Fmt.num(Math.abs(ritmoReal),1)} kg/sem, justo en tu objetivo. Mantengo tus calorías. 🎯`;
    }
    return { hayDato: true, ajuste, ritmoReal, objetivo, texto };
  }

  // Macros objetivo (g). Proteína alta para conservar músculo en déficit;
  // grasa suficiente para hormonas; el resto en carbos para rendimiento.
  // Aplica el ajuste adaptativo aprendido de tu progreso.
  function macros(p) {
    const cal = objetivoCalorico(p);
    const apr = aprendizaje(p);
    const kcal = Math.max(p.sexo === "M" ? 1500 : 1300, cal.objetivo + (apr.ajuste || 0));
    // Proteína: 2.0 g/kg (definición). Grasa: 0.9 g/kg. Carbos: el resto.
    const prot = Math.round((p.objetivo === "mantener" ? 1.8 : 2.0) * p.pesoKg);
    const grasa = Math.round(0.9 * p.pesoKg);
    const kcalRestante = kcal - prot * 4 - grasa * 9;
    const carbs = Math.max(80, Math.round(kcalRestante / 4)); // mínimo funcional
    return {
      kcal,
      mantenimiento: cal.mantenimiento,
      deficitPct: cal.deficitPct,
      prot, grasa, carbs,
      protKcal: prot * 4, carbsKcal: carbs * 4, grasaKcal: grasa * 9,
      gPorKgProt: +(prot / p.pesoKg).toFixed(1),
      agua: Math.round((35 * p.pesoKg + 500) / 250), // vasos de 250 ml aprox
    };
  }

    if (duros.indexOf(tipoEntrenoHoy) >= 0) {
      // Día duro: sube carbos (+25%) y calorías para rendir y recuperar
      carbs = Math.round(base.carbs * 1.25);
      kcal = base.kcal + Math.round(base.carbs * 0.25 * 4);
      nota = "Día de carga alta: sube carbohidratos para rendir y recuperar.";
    } else if (!tipoEntrenoHoy || tipoEntrenoHoy === "descanso") {
      // Descanso: baja carbos (-20%), mantén proteína
      carbs = Math.round(base.carbs * 0.8);
      kcal = base.kcal - Math.round(base.carbs * 0.2 * 4);
      nota = "Descanso: baja un poco los carbohidratos, mantén la proteína.";
    } else if (suaves.indexOf(tipoEntrenoHoy) >= 0) {

    }
    if (semanas != null && semanas <= 5) {
      return { nombre: "Fase específica", semanas, desc: "Trabajo a ritmo de meta (4:00/km) y umbral. Aquí se afila la velocidad del 5k." };
    }
    if (semanas != null && semanas <= 9) {
      return { nombre: "Fase de calidad (VO2máx)", semanas, desc: "Intervalos duros para subir tu techo aeróbico. El motor del sub-20." };
    }
    return { nombre: "Fase base", semanas, desc: "Construye kilometraje fácil y fuerza. La base que sostiene todo lo demás." };
  }

  // ---------- Detalle de cada sesión de running ----------
  function detalleSesion(tipo, p) {
    const z = zonas(p);
    const f = fase(p);
    const objetivo = Fmt.ritmo(z.objetivo);
    switch (tipo) {
      case "intervals": {
        // Menú de intervalos según fase
        let bloque;
        if (f.nombre.indexOf("base") >= 0) {
          bloque = "5 × 3 min fuerte / 2 min trote suave";
        } else if (f.nombre.indexOf("VO2") >= 0 || f.nombre.indexOf("calidad") >= 0) {
          bloque = `6 × 800 m a ${Fmt.ritmo(z.intervalos)} · recup. 90 s trote`;
        } else if (f.nombre.indexOf("específica") >= 0) {
          bloque = `5 × 1000 m a ${objetivo} (ritmo de meta) · recup. 90 s`;
        } else {
          bloque = `4 × 1000 m a ${objetivo} · recup. 2 min`;
        }
        return {
          titulo: "Intervalos (VO2 máx)",
          detalle: bloque,
          calienta: "10–15 min suave + 4 progresiones de 20 s",
          enfria: "10 min muy suave",
          ritmo: `Repes ~${Fmt.ritmo(z.intervalos)} · meta ${objetivo}`,
          tip: "La sesión clave para el sub-20. Corre las repes controlada pero fuerte; las últimas deben costar.",
        };
      }
      case "tempo":
        return {
          titulo: "Tempo / umbral",
          detalle: `20–30 min continuos a ${Fmt.ritmo(z.tempo)} (cómodamente duro)`,
          calienta: "10 min suave",
          enfria: "10 min suave",
          ritmo: `Umbral ~${Fmt.ritmo(z.tempo)}`,
          tip: "Ritmo 'cómodamente duro': podrías decir solo frases cortas. Sube tu resistencia a la velocidad.",
        };
      case "long":
        return {
          titulo: "Tirada larga",
          detalle: `8–12 km a ${Fmt.ritmo(z.larga)} (suave, conversando)`,
          calienta: "Arranca fácil",
          enfria: "Camina 3–5 min al final",
          ritmo: `Suave ~${Fmt.ritmo(z.larga)}`,
          tip: "Construye base aeróbica. Si quieres, termina los últimos 2 km algo más rápidos.",
        };
      case "easy":
        return {
          titulo: "Rodaje suave",
          detalle: `30–40 min a ${Fmt.ritmo(z.facil)} (regenerativo)`,
          calienta: "",
          enfria: "Estiramientos suaves",
          ritmo: `Fácil ~${Fmt.ritmo(z.facil)}`,
          tip: "Debe sentirse fácil. Corre lento para poder correr rápido los días de calidad.",
        };
      case "test5k":
        return {
          titulo: "Test de 5 km",
          detalle: `5 km a tope. Objetivo: acercarte a ${Fmt.tiempo(p.objetivoTiempoSeg)} (${objetivo})`,
          calienta: "15 min suave + 4 progresiones",
          enfria: "10 min muy suave",
          ritmo: `Meta ${objetivo}`,
          tip: "Sal controlada los primeros 1–2 km (no más rápido que el ritmo meta) y aprieta al final. Registra el tiempo.",
        };
      default:
        return { titulo: TIPOS[tipo] ? TIPOS[tipo].label : tipo, detalle: "", calienta: "", enfria: "", ritmo: "", tip: "" };
    }
  }

  // ---------- Generador de la semana ----------
  // Coloca sesiones de calidad en los mejores días libres respetando la
  // recuperación (no dos días duros seguidos, no calidad el día después del fútbol).
  function generarSemana(p) {
    const desc = new Set(p.diasDescanso || []);
    const fut = new Set(p.diasFutbol || []);
    const gymDays = new Set((p.diasGym || []).filter((i) => !desc.has(i) && !fut.has(i)));
    const grupos = p.gymGrupos || {};

    const dias = [];
    for (let i = 0; i < 7; i++) {
      dias.push({
        idx: i,
        descanso: desc.has(i),
        futbol: fut.has(i),
        gym: gymDays.has(i) ? ((grupos[i] && grupos[i].length) ? grupos[i] : ["tren superior"]) : null,
        run: null,
      });
    }

    // Un día carga las piernas si hay fútbol o gym de pierna/glúteo/full body.
    const legLoad = (d) => d.futbol || grupoLeg(d.gym);
    function diasDuros() {
      const s = [];
      dias.forEach((d) => {
        if (d.futbol || legLoad(d) || (d.run && HARD.indexOf(d.run) >= 0) || d.run === "long") s.push(d.idx);
      });
      return s;
    }
    function gap(idx) {
      const hd = diasDuros().filter((h) => h !== idx);
      let min = 7;
      hd.forEach((h) => {
        const g = Math.min(Math.abs(h - idx), 7 - Math.abs(h - idx));
        if (g < min) min = g;
      });
      return min;
    }
    // Candidatos para calidad de running: ni descanso, ni fútbol, ni día de pierna,
    // y que no tengan ya un running. Se puede combinar con gym de tren superior.
    function candidatosCalidad() {
      return dias.filter((d) => !d.descanso && !d.futbol && !legLoad(d) && !d.run);
    }

    function colocarCalidad(tipo, preferFinde) {
      const cands = candidatosCalidad();
      if (!cands.length) return false;
      let best = null, bestScore = -Infinity;
      cands.forEach((d) => {
        let score = gap(d.idx);
        if (preferFinde && (d.idx === 5 || d.idx === 6)) score += 1.5;
        if (preferFinde && d.idx === 4) score += 0.5;
        if (fut.has((d.idx + 6) % 7)) score -= 1.2; // día después del fútbol
        if (fut.has((d.idx + 1) % 7)) score -= 0.6; // día antes del fútbol
        if (d.gym) score -= 0.3; // preferir día libre sobre doble sesión
        if (score > bestScore) { bestScore = score; best = d; }
      });
      if (best) { best.run = tipo; return true; }
      return false;
    }

    // Prioridad: intervalos, tempo, tirada larga (finde). Luego un rodaje suave.
    colocarCalidad("intervals", false);
    colocarCalidad("tempo", false);
    colocarCalidad("long", true);
    colocarCalidad("easy", false);

    // Construir la salida legible: cada día puede tener gym + running.
    return dias.map((d) => {
      const idx = d.idx;
      const gymDet = d.gym ? gymDetalle(d.gym) : null;
      let extra = null;

      // Tipo "principal" para la insignia y la nutrición (lo más duro del día)
      let principal;
      if (d.descanso) principal = "descanso";
      else if (d.futbol) { principal = "futbol"; extra = "Cuenta como velocidad + agilidad. Hidrátate y come carbos antes."; }
      else if (d.run && (HARD.indexOf(d.run) >= 0 || d.run === "long")) principal = d.run;
      else if (d.gym) principal = "gym";
      else if (d.run) principal = d.run;
      else principal = "descanso";

      if (gymDet) {
        const gruposTxt = gymDet.bloques.map((b) => b.label).join(" · ");
        extra = `Gym: ${gruposTxt}.` + (d.run ? " Combínalo con el running (deja unas horas o hazlos en distinto momento del día)." : "");
      }

      return {
        idx,
        dia: Fmt.DIAS_LARGO[(idx + 1) % 7], // idx0=lunes -> DIAS_LARGO index 1
        tipo: principal,
        info: TIPOS[principal] || TIPOS.descanso,
        gym: d.gym,          // array de grupos, o null
        gymDetalle: gymDet,  // {bloques, esPierna} o null
        run: d.run,          // tipo de running del día, o null
        extra,
        detalle: (d.run && ["intervals", "tempo", "long", "easy", "test5k"].indexOf(d.run) >= 0)
          ? detalleSesion(d.run, p) : null,
      };
    });
  }

  // Etiqueta corta de la carga del día (para nutrición)
  function cargaDelDia(tipo) {
    if (["intervals", "tempo", "long", "test5k", "carrera", "futbol"].indexOf(tipo) >= 0) return "alta";
    if (["easy", "gym", "movilidad"].indexOf(tipo) >= 0) return "media";
    return "baja";
  }

  // ---------- Proyección hacia el reto ----------
  function proyeccion(p) {
    const objetivo = p.objetivoTiempoSeg || 1200;
    const tests = window.Store.tests5k();
    const actual = p.mejor5kSeg || 0;
    if (!actual) {
      return {
        hayDato: false,
        mensaje: "Haz un test de 5 km para medir tu punto de partida y proyectar tu avance hacia el sub-20.",
      };
    }
    const gap = actual - objetivo; // segundos que faltan por recortar
    const listo = gap <= 0;
    // Mejora realista: ~1.5% del tiempo por mes con entreno consistente (intermedio)
    const mejoraMensual = actual * 0.015;
    const mesesEstimados = listo ? 0 : Math.ceil(gap / mejoraMensual);
    // Tendencia con los últimos tests (si hay 2+)
    let tendencia = null;
    if (tests.length >= 2) {
      const primero = tests[0], ultimo = tests[tests.length - 1];
      const dSeg = ultimo.timeSeg - primero.timeSeg;
      const dDias = Math.max(1, Fmt.diasEntre(primero.date, ultimo.date));
      tendencia = { segPorSemana: (dSeg / dDias) * 7, mejorando: dSeg < 0 };
    }
    const pct = Math.max(0, Math.min(100, Math.round(
      // progreso desde un 5k de referencia "principiante" (28:00) hacia la meta
      ((1680 - actual) / (1680 - objetivo)) * 100
    )));
    return {
      hayDato: true, listo, actual, objetivo, gap,
      mesesEstimados, mejoraMensual, tendencia, progresoPct: pct,
      mensaje: listo
        ? "¡Ya estás en tiempo de sub-20! Ahora se trata de consolidarlo y repetirlo."
        : `Te faltan ${Fmt.tiempo(gap)} por recortar. Con constancia, ~${mesesEstimados} ${mesesEstimados === 1 ? "mes" : "meses"} de entreno enfocado.`,
    };
  }

  // Consejos del entrenador (reglas de experto)
  function consejos(p) {
    const z = zonas(p);
    return [
      { ico: "🎯", titulo: "El 80/20 del corredor", texto: `El 80% de tus km deben ser suaves (~${Fmt.ritmo(z.facil)}) y solo el 20% duros. Correr fácil la mayoría del tiempo es lo que permite correr rápido el día de calidad.` },
      { ico: "🔥", titulo: "Dos calidades por semana", texto: "Intervalos (VO2máx) + tempo (umbral). Son las sesiones que suben tu velocidad para el 5k. No más de dos por semana para no lesionarte." },
      { ico: "⚽", titulo: "El fútbol ya es entrenamiento", texto: "Los sprints del partido mejoran tu velocidad y potencia. Cuéntalo como un día duro: no metas intervalos el día antes ni el día después." },
      { ico: "🏋️‍♀️", titulo: "La fuerza te hace más rápida", texto: "Sentadilla, peso muerto, zancadas y core 2×/semana te dan economía de carrera y previenen lesiones. Levantar no te pone 'voluminosa', te pone potente." },
      { ico: "🦵", titulo: "Respeta la recuperación", texto: "Nunca dos días duros seguidos. El progreso ocurre cuando descansas, no solo cuando entrenas. Duerme 7–9 h." },
      { ico: "⏱️", titulo: "Ritmo de meta: 4:00/km", texto: "Para sentir el sub-20, incluye repes al ritmo objetivo (4:00/km). Tu cuerpo aprende ese ritmo y deja de parecer imposible." },
      { ico: "📈", titulo: "Progresa poco a poco", texto: "Sube el volumen máximo ~10% por semana y haz un test de 5k cada 3–4 semanas para ver el avance real." },
      { ico: "👟", titulo: "Técnica y cadencia", texto: "Apunta a ~170–180 pasos/min, pisada bajo tu cuerpo y postura erguida. Corres más económica y con menos impacto." },
    ];
  }

  window.Train = {
    TIPOS, GRUPOS, GRUPOS_ORDEN, grupoLabel, gymDetalle,
    ritmoObjetivo, ritmoReferencia, zonas, fase,
    detalleSesion, generarSemana, cargaDelDia, proyeccion, consejos,
  };
})();

/* coach.js — El agente coach. Combina el nutricionista y el entrenador para
   decirte qué hacer HOY: tu entreno, qué comer, cuánta agua y las alertas. */
(function () {
  "use strict";

  // Plan de la semana cacheado (se regenera cuando cambia el perfil)
  function semana() {
    return window.Train.generarSemana(window.Store.get().profile);
  }

  // Índice del día de hoy (0=lun ... 6=dom)
  function idxHoy() {
    return Fmt.diaSemanaLun(Fmt.hoy());
  }

  // El plan de entreno de hoy
  function entrenoHoy() {
    const plan = semana();
    return plan[idxHoy()];
  }

  // Guía completa de hoy: entreno + nutrición del día + agua
  function hoy() {
    const p = window.Store.get().profile;
    const ent = entrenoHoy();
    const carga = window.Train.cargaDelDia(ent.tipo);
    const dateStr = Fmt.ymd(Fmt.hoy());
    const nut = window.Nutri.resumenDia(dateStr, ent.tipo);
    const plan = window.Nutri.planEjemplo(p, carga);
    const agua = window.Store.getAgua(dateStr);
    return { fecha: dateStr, entreno: ent, carga, nutricion: nut, planComida: plan, agua };
  }

  // Foco del día: una frase corta y motivadora
  function foco() {
    const ent = entrenoHoy();
    const t = ent.tipo;
    const map = {
      intervals: "Hoy toca velocidad. Estas repes son las que te llevan al sub-20. 💪",
      tempo: "Día de umbral: cómodamente duro. Aguanta el ritmo. ⚡",
      long: "Tirada larga y suave. Construyes el motor. Disfruta el km. 🛣️",
      easy: "Rodaje regenerativo. Suave de verdad: hoy se recupera. 🌿",
      test5k: "¡Día de test! Mide tu avance y aprieta al final. ⏱️",
      gym: "Fuerza hoy. Más fuerte = más rápida y sin lesiones. 🏋️‍♀️",
      futbol: "Partido: disfrútalo y aprovecha los sprints. Hidrátate bien. ⚽",
      descanso: "Descanso. El progreso se cocina hoy. Duerme bien y come tu proteína. 😴",
    };
    return map[t] || "A por el día. Consistencia > perfección.";
  }

  // Alertas inteligentes (nutrición + entreno + progreso)
  function alertas() {
    const p = window.Store.get().profile;
    const out = [];
    const dateStr = Fmt.ymd(Fmt.hoy());
    const ent = entrenoHoy();
    const nut = window.Nutri.resumenDia(dateStr, ent.tipo);
    const obj = nut.objetivo, con = nut.consumido;

    // ---- Proteína ----
    if (con.kcal > 0) {
      const faltaProt = obj.prot - con.prot;
      if (faltaProt > 25) {
        out.push({ tipo: "warn", ico: "🥩", titulo: "Te falta proteína",
          texto: `Llevas ${Fmt.num(con.prot)} g de ${obj.prot} g. Suma una fuente magra (pollo, atún, huevo, yogur griego o un scoop de whey).` });
      } else if (con.prot >= obj.prot * 0.9) {
        out.push({ tipo: "good", ico: "✅", titulo: "Proteína en meta", texto: "Vas muy bien con la proteína hoy. Así se conserva el músculo en déficit." });
      }
    }

    // ---- Calorías ----
    if (con.kcal > obj.kcal + 250) {
      out.push({ tipo: "warn", ico: "⚖️", titulo: "Por encima de tu objetivo",
        texto: `Vas en ${Fmt.num(con.kcal)} kcal (meta ${Fmt.num(obj.kcal)}). No pasa nada por un día; retoma mañana. Prioriza proteína y verduras.` });
    } else if (con.kcal > 0 && con.kcal < obj.kcal * 0.6 && new Date().getHours() >= 19) {
      out.push({ tipo: "info", ico: "🍽️", titulo: "Vas muy baja en calorías",
        texto: `Solo ${Fmt.num(con.kcal)} kcal hoy. Comer muy poco te quita energía para entrenar y rendir. Completa tu cena.` });
    }

    // ---- Agua ----
    const agua = window.Store.getAgua(dateStr);
    if (agua < (p.aguaMetaVasos || 8) && new Date().getHours() >= 15) {
      out.push({ tipo: "info", ico: "💧", titulo: "Hidrátate",
        texto: `Llevas ${agua}/${p.aguaMetaVasos || 8} vasos. ${["intervals","tempo","long","futbol","test5k"].indexOf(ent.tipo)>=0 ? "Hoy entrenas duro: bebe más." : "Sigue tomando agua a lo largo del día."}` });
    }

    // ---- Carbos en día duro ----
    if (window.Train.cargaDelDia(ent.tipo) === "alta" && con.kcal > 0 && con.carbs < obj.carbs * 0.6) {
      out.push({ tipo: "warn", ico: "🍚", titulo: "Sube carbohidratos hoy",
        texto: `Hoy es día de carga alta (${ent.info.label}). Vas en ${Fmt.num(con.carbs)} g de ${obj.carbs} g de carbos. Necesitas energía para rendir.` });
    }

    // ---- Test de 5k pendiente ----
    const tests = window.Store.tests5k();
    const ultimoTest = tests.length ? tests[tests.length - 1] : null;
    if (!ultimoTest) {
      out.push({ tipo: "info", ico: "⏱️", titulo: "Haz tu primer test de 5 km",
        texto: "Necesitamos tu tiempo actual para calcular tus ritmos y proyectar el sub-20. Registra un test cuando puedas." });
    } else if (Fmt.diasEntre(ultimoTest.date, Fmt.hoy()) > 28) {
      out.push({ tipo: "info", ico: "📈", titulo: "Toca test de 5 km",
        texto: `Tu último test fue hace ${Fmt.diasEntre(ultimoTest.date, Fmt.hoy())} días. Mide de nuevo para ver tu avance real.` });
    }

    // ---- Tendencia de peso ----
    const meds = window.Store.medicionesOrdenadas().filter((m) => m.pesoKg > 0);
    if (meds.length >= 2) {
      const prim = meds[0], ult = meds[meds.length - 1];
      const dKg = ult.pesoKg - prim.pesoKg;
      const dSem = Math.max(1, Fmt.diasEntre(prim.date, ult.date) / 7);
      const ritmoSem = dKg / dSem;
      if (p.objetivo !== "mantener") {
        if (ritmoSem < -0.8) {
          out.push({ tipo: "warn", ico: "⚠️", titulo: "Estás bajando muy rápido",
            texto: `~${Fmt.num(Math.abs(ritmoSem),1)} kg/semana. Bajar tan rápido te hace perder músculo y rendimiento. Sube un poco las calorías (sobre todo carbos).` });
        } else if (ritmoSem >= -0.6 && ritmoSem <= -0.15) {
          out.push({ tipo: "good", ico: "🎯", titulo: "Ritmo de definición ideal",
            texto: `Bajas ~${Fmt.num(Math.abs(ritmoSem),1)} kg/semana. Ese es el punto dulce: pierdes grasa y conservas músculo.` });
        } else if (ritmoSem > 0.1) {
          out.push({ tipo: "info", ico: "📊", titulo: "El peso no baja",
            texto: "Puede ser normal (agua, músculo, ciclo). Si sigue 2–3 semanas, ajusta un poco las calorías o el volumen de entreno." });
        }
      }
    } else if (meds.length === 0) {
      out.push({ tipo: "info", ico: "⚖️", titulo: "Registra tu peso y medidas",
        texto: "Añade tu primera medición para seguir tu progreso hacia la definición." });
    }

    return out;
  }

  // Resumen para la pantalla de inicio (KPIs)
  function resumen() {
    const p = window.Store.get().profile;
    const dateStr = Fmt.ymd(Fmt.hoy());
    const ent = entrenoHoy();
    const nut = window.Nutri.resumenDia(dateStr, ent.tipo);
    const proj = window.Train.proyeccion(p);
    return { entreno: ent, nutricion: nut, proyeccion: proj, foco: foco() };
  }

  window.Coach = { semana, idxHoy, entrenoHoy, hoy, foco, alertas, resumen };
})();

/* app.js — interfaz, navegación y formularios de Rayada. */
(function () {
  "use strict";

  const main = document.getElementById("main");
  const overlay = document.getElementById("sheet-overlay");
  const onbRoot = document.getElementById("onb-root");
  let navActual = "inicio";
  const expandidos = new Set(); // días del plan expandidos

  // ---------- utilidades ----------
  const esc = (s) => String(s == null ? "" : s)
    .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;").replace(/'/g, "&#39;");
  const clamp = (n, a, b) => Math.max(a, Math.min(b, n));
  const pctFill = (val, obj) => obj > 0 ? clamp(Math.round((val / obj) * 100), 0, 100) : 0;

  function openSheet(html) {
    overlay.innerHTML = `<div class="sheet"><div class="grab"></div>${html}</div>`;
    overlay.classList.add("open");
    document.body.style.overflow = "hidden";
  }
  function closeSheet() {
    overlay.classList.remove("open");
    overlay.innerHTML = "";
    document.body.style.overflow = "";
  }
  overlay.addEventListener("click", (e) => { if (e.target === overlay) closeSheet(); });

  // ---------- navegación ----------
  function irA(nav) {
    navActual = nav;
    document.querySelectorAll(".nav button").forEach((b) =>
      b.classList.toggle("active", b.dataset.nav === nav));
    render();
    main.scrollIntoView({ block: "start" });
    window.scrollTo(0, 0);
  }
  document.querySelectorAll(".nav button").forEach((b) =>
    b.addEventListener("click", () => irA(b.dataset.nav)));
  document.getElementById("btn-ajustes").addEventListener("click", sheetAjustes);
  document.getElementById("fab").addEventListener("click", sheetAgregar);

  // ======================================================================
  //  COMPONENTES REUTILIZABLES
  // ======================================================================
  function macroRing(nut) {
    const o = nut.objetivo, c = nut.consumido;
    const p = pctFill(c.kcal, o.kcal);
    const restante = Math.max(0, o.kcal - c.kcal);
    return `
      <div class="macro-ring-row">
        <div class="big-ring" style="--p:${p}">
          <div class="rv">
            <div class="n">${Fmt.num(c.kcal)}</div>
            <div class="l">de ${Fmt.num(o.kcal)} kcal</div>
          </div>
        </div>
        <div class="macro-bars">
          ${macroBar("Proteína", "prot", c.prot, o.prot)}
          ${macroBar("Carbos", "carbs", c.carbs, o.carbs)}
          ${macroBar("Grasa", "grasa", c.grasa, o.grasa)}
          <div class="small muted" style="margin-top:8px">${restante > 0 ? `Te quedan <b>${Fmt.num(restante)} kcal</b>` : "Objetivo cubierto ✅"}</div>
        </div>
      </div>`;
  }
  function macroBar(nombre, clase, val, obj) {
    return `<div class="mbar">
      <div class="mt"><span class="nm ${clase}">${nombre}</span><span class="vl">${Fmt.num(val)} / ${Fmt.num(obj)} g</span></div>

  // Rellena #fotos-cont de forma asíncrona
  async function cargarFotos() {
    const cont = document.getElementById("fotos-cont");
    if (!cont || !window.Fotos) return;
    let metas;
    try { metas = await Fotos.list(); } catch (e) { cont.innerHTML = `<div class="empty small">No se pudieron cargar las fotos.</div>`; return; }
    if (!metas.length) {
      cont.innerHTML = `<div class="empty"><div class="big-emoji">📸</div>Aún no tienes fotos.<br>Toma una hoy y compara tu progreso con el tiempo.</div>
        <button class="btn secondary block" data-add="foto">📸 Tomar / subir foto</button>`;
      return;
    }
    // grid con placeholders; carga cada imagen
    cont.innerHTML = `<div class="photo-grid">${metas.map((m)=>`
      <div class="photo-cell" data-foto="${m.id}"><div class="pc-date">${Fmt.fecha(m.date)}</div></div>`).join("")}</div>
      <div class="small muted center mt8">${metas.length} foto${metas.length>1?"s":""}. Toca una para verla en grande.</div>`;
    metas.forEach(async (m) => {
      const cell = cont.querySelector(`[data-foto="${m.id}"]`);
      if (!cell) return;
      try {
        const url = await Fotos.url(m.id);
        if (url) { const img = new Image(); img.src = url; img.alt = ""; cell.insertBefore(img, cell.firstChild); }
      } catch (e) {}
    });
  }

  // Visor de foto a pantalla completa
  async function verFoto(id) {
    let url, metas;
    try { url = await Fotos.url(id); metas = await Fotos.list(); } catch (e) { return; }
    if (!url) return;
    const m = metas.find((x) => x.id === id) || {};
    const div = document.createElement("div");
    div.className = "photo-viewer";
    div.innerHTML = `<img src="${url}" alt="">
      <div class="pv-meta">${Fmt.fechaLarga(m.date||Fmt.hoy())}${m.nota?`<div class="small muted">${esc(m.nota)}</div>`:""}</div>
      <div class="pv-actions"><button class="btn danger sm" id="pv-del">🗑 Borrar</button><button class="btn primary sm" id="pv-close">Cerrar</button></div>`;
    document.body.appendChild(div);
    const cerrar = () => { document.body.removeChild(div); URL.revokeObjectURL(url); };
    div.addEventListener("click", (e) => { if (e.target === div) cerrar(); });
    div.querySelector("#pv-close").onclick = cerrar;
    div.querySelector("#pv-del").onclick = async () => {
      if (confirm("¿Borrar esta foto?")) { await Fotos.remove(id); cerrar(); if (navActual === "progreso") cargarFotos(); }
    };
  }

  // Gráfico de líneas simple (SVG) para tiempos de 5k (menor = mejor)
  function chartTiempos(tests, objetivo) {
    const pts = tests.map((t) => ({ x: t.date, y: t.timeSeg }));
    const ys = pts.map((p) => p.y).concat([objetivo]);
    let min = Math.min.apply(null, ys), max = Math.max.apply(null, ys);
    if (max - min < 30) { max += 30; min -= 30; }
    const W = 320, H = 140, pad = 24;
    const n = pts.length;
    const xAt = (i) => n <= 1 ? W / 2 : pad + (i * (W - 2 * pad)) / (n - 1);
    const yAt = (v) => H - pad - ((v - min) / (max - min)) * (H - 2 * pad);
    let line = "", dots = "";
    pts.forEach((p, i) => {
      const x = xAt(i), y = yAt(p.y);
      line += (i === 0 ? "M" : "L") + x.toFixed(1) + " " + y.toFixed(1) + " ";
      dots += `<circle class="dot" cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="3.5"/>`;
    });
    const gy = yAt(objetivo);
    return `<div class="chart-wrap"><svg class="chart" viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid meet">
      <defs><linearGradient id="grad" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="var(--accent)"/><stop offset="1" stop-color="var(--accent)" stop-opacity="0"/></linearGradient></defs>
      <line class="goal-line" x1="${pad}" y1="${gy.toFixed(1)}" x2="${W-pad}" y2="${gy.toFixed(1)}"/>
      <text class="lbl" x="${W-pad}" y="${(gy-5).toFixed(1)}" text-anchor="end">meta ${Fmt.tiempo(objetivo)}</text>
      <path class="line" d="${line}"/>${dots}
    </svg></div>`;
  }

  // Gráfico de peso
  function chartPeso(meds) {
    const pts = meds.map((m) => m.pesoKg);
    let min = Math.min.apply(null, pts), max = Math.max.apply(null, pts);
    if (max - min < 2) { max += 1; min -= 1; }
    const W = 320, H = 130, pad = 20;
    const n = pts.length;
    const xAt = (i) => n <= 1 ? W / 2 : pad + (i * (W - 2 * pad)) / (n - 1);
    const yAt = (v) => H - pad - ((v - min) / (max - min)) * (H - 2 * pad);
    let line = "", dots = "";
    pts.forEach((v, i) => {
      const x = xAt(i), y = yAt(v);
      line += (i === 0 ? "M" : "L") + x.toFixed(1) + " " + y.toFixed(1) + " ";
      dots += `<circle class="dot" cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="3"/>`;
    });
    return `<div class="chart-wrap" style="margin-top:8px"><svg class="chart" viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid meet">
      <path class="line" d="${line}"/>${dots}</svg></div>`;
  }
