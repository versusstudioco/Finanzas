<!DOCTYPE html>
<html lang="es">
<head>

  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no">
  <title>Rayada</title>

  <meta name="theme-color" content="#0a0e0c">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./icons/icon.svg" type="image/svg+xml">

  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

  <link rel="stylesheet" href="./css/styles.css?v=1">

<body>

      <div>
        <h1>Rayada<span class="logo-dot">.</span></h1>

    <main id="main"><!-- las pantallas se inyectan aquí --></main>

    </nav>
  </div>

  <button class="fab" id="fab" aria-label="Agregar">＋</button>

  <div class="sheet-overlay" id="sheet-overlay"></div>
  <div id="onb-root" style="display:none;"></div>

  <script src="./js/format.js?v=1"></script>
  <script src="./js/store.js?v=1"></script>
  <script src="./js/nutrition.js?v=1"></script>
  <script src="./js/training.js?v=1"></script>
  <script src="./js/coach.js?v=1"></script>
  <script src="./js/app.js?v=1"></script>
